<style>
  :root{
    /* Bridges Electric palette: paper + ink, van-black with gold leaf on dark grounds only */
    --bg:#F2F2F0;
    --surface:#FFFFFF;
    --ink:#1A1A1A;
    --ink-soft:#595959;
    --accent:#0C1218;
    --accent-dark:#7A611A;
    --line:#DCDCD8;
    --danger:#B3452F;
    --danger-bg:#FBEAE6;
    --success:#3F7A53;
    --success-bg:#E8F3EA;
    --warn-bg:#F7F0DC;
    --steel:#0C1218;
    --steel-light:#1C252E;
    --gold:#D4AF37;
    --signal:#FF870E; /* orange: dark grounds only, never text on white */
    --font-body:"Gill Sans","Gill Sans MT",Calibri,"Segoe UI",sans-serif;
    --font-wordmark:"Copperplate Gothic Bold",Copperplate,"Copperplate Gothic",serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--font-body);background:var(--bg);color:var(--ink);}
  .app-shell{display:flex;min-height:100vh;}

  .brand-mark{font-family:var(--font-body);font-size:21px;font-weight:600;letter-spacing:.3px;line-height:1.1;}

  .dog-mark.sm{width:22px;height:25px;}
  .wordmark{font-family:var(--font-wordmark);font-weight:700;font-size:10.5px;letter-spacing:.06em;color:var(--gold);margin-top:3px;white-space:nowrap;}
  .wordmark.on-paper{color:var(--ink-soft);}
  .sidebar-user{padding:16px 22px;border-bottom:1px solid rgba(255,255,255,.1);font-size:12.5px;color:#CFD2D4;}
  .nav-item{width:100%;background:none;border:none;border-left:3px solid transparent;font-family:inherit;text-align:left;display:flex;align-items:center;gap:10px;padding:12px 22px;font-size:14px;font-weight:500;color:#CFD2D4;cursor:pointer;}
  .nav-item:hover{background:rgba(255,255,255,.05);color:#fff;}
  .nav-item.active{background:rgba(212,175,55,.10);border-left-color:var(--gold);color:#fff;}
  .nav-count{margin-left:auto;background:rgba(255,255,255,.12);padding:1px 8px;border-radius:20px;font-size:11px;}
  .sidebar-footer{margin-top:auto;padding:16px 22px;font-size:11px;color:#8A9096;line-height:1.5;}

  /* ---- Main ---- */
  .main{flex:1;padding:34px 40px;min-width:0;}
  .topbar{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:24px;gap:20px;flex-wrap:wrap;}
  .page-title{font-family:var(--font-body);font-size:27px;font-weight:600;letter-spacing:.2px;margin:0;}
  .page-sub{color:var(--ink-soft);font-size:13.5px;margin-top:4px;}
  .btn{font-family:var(--font-body);border:none;border-radius:2px;padding:10px 16px;font-size:13.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:filter .12s;}
  .btn:hover{filter:brightness(0.95);}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{filter:none;background:var(--steel-light);}
  .btn-secondary{background:var(--surface);color:var(--ink);border:1px solid var(--line);}
  .btn-danger{background:var(--danger-bg);color:var(--danger);}
  .btn-ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line);}
  .btn-sm{padding:6px 11px;font-size:12.5px;border-radius:2px;}

  .toolbar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;align-items:center;}
  .search-input{flex:1;min-width:220px;padding:10px 14px;border:1px solid var(--line);border-radius:2px;font-size:13.5px;font-family:var(--font-body);background:var(--surface);}
  .search-input:focus{outline:2px solid var(--ink);outline-offset:1px;}

  /* ---- Cards / table ---- */
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:4px;overflow:hidden;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;padding:11px 16px;background:#F7F7F5;color:var(--ink-soft);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--line);}
  td{padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tr.row-link{cursor:pointer;}
  tr.row-link:hover{background:#FAFAF8;}
  .empty-state{padding:60px 30px;text-align:center;color:var(--ink-soft);}
  .empty-state .big{font-family:var(--font-body);font-size:18px;color:var(--ink);margin-bottom:6px;}

  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;}
  .badge-ok{background:var(--success-bg);color:var(--success);}
  .badge-warn{background:var(--warn-bg);color:var(--accent-dark);}
  .badge-due{background:var(--danger-bg);color:var(--danger);}
  .badge-none{background:#EDEDEA;color:var(--ink-soft);}
  .dot{width:7px;height:7px;border-radius:50%;background:currentColor;}

  .name-cell{font-weight:600;}
  .sub-cell{color:var(--ink-soft);font-size:12.5px;margin-top:2px;}

  /* nameplate signature element */
  .nameplate{background:linear-gradient(155deg,var(--steel-light),var(--steel));border-radius:4px;padding:14px 16px;position:relative;color:#fff;min-width:170px;}
  .nameplate::before,.nameplate::after{content:'';position:absolute;width:5px;height:5px;border-radius:50%;top:8px;left:8px;background:var(--gold);box-shadow:0 0 0 1px rgba(0,0,0,.3) inset;}
  .nameplate::after{left:auto;right:8px;}
  .nameplate .np-make{font-family:var(--font-body);font-size:14px;font-weight:600;letter-spacing:1px;text-transform:uppercase;}
  .nameplate .np-model{font-size:11.5px;color:#C9CDD0;margin-top:1px;}
  .nameplate .np-serial{font-family:'Roboto Mono',monospace;font-size:11px;letter-spacing:1.5px;color:var(--gold);margin-top:8px;}

  .gen-card{border:1px solid var(--line);border-radius:4px;padding:0;display:flex;overflow:hidden;background:var(--surface);}
  .gen-card .nameplate{border-radius:0;flex-shrink:0;width:190px;display:flex;flex-direction:column;justify-content:center;}
  .gen-card-body{padding:14px 18px;flex:1;display:flex;flex-direction:column;gap:6px;}
  .gen-card-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
  .gen-meta{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-soft);}
  .gen-meta b{color:var(--ink);font-weight:600;}
  .gen-actions{display:flex;gap:8px;}
  .gen-notes{font-size:12.5px;color:var(--ink-soft);background:#F7F7F5;padding:8px 10px;border-radius:2px;margin-top:2px;}

  /* ---- Detail / breadcrumb ---- */
  .crumb{background:none;border:none;padding:0;font-family:inherit;font-size:12.5px;color:var(--accent-dark);cursor:pointer;font-weight:600;margin-bottom:14px;display:inline-flex;align-items:center;gap:5px;}
  .crumb:hover{text-decoration:underline;}
  .link-btn{background:none;border:none;padding:0;font:inherit;color:inherit;text-decoration:underline;cursor:pointer;}
  .btn:disabled{opacity:.6;cursor:default;}
  tr.row-link:focus-visible,.nav-item:focus-visible{outline:2px solid var(--gold);outline-offset:-2px;}
  .detail-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;margin-bottom:22px;}

  /* ---- Mobile nav (hamburger + off-canvas sidebar) ---- */
  .mobile-topbar{display:none;align-items:center;gap:12px;margin-bottom:20px;}
  .hamburger-btn{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:2px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:18px;cursor:pointer;flex-shrink:0;}
  .mobile-topbar-brand{font-family:var(--font-body);font-size:16px;font-weight:600;color:var(--ink);}
  .sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(12,18,24,.55);z-index:65;}

  @media(max-width:900px){
    .detail-grid{grid-template-columns:1fr;}
    .main{padding:20px 16px;}
    .mobile-topbar{display:flex;}
    .sidebar-backdrop{display:block;}
    .sidebar{position:fixed;top:0;left:0;height:100vh;transform:translateX(-100%);transition:transform .25s ease;z-index:70;}
    .sidebar.open{transform:translateX(0);}
  }
  .info-block{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:20px 22px;}
  .info-block h3{margin:0 0 14px 0;font-family:var(--font-body);font-size:14px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-soft);}
  .field-row{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #EDEDEA;font-size:13.5px;}
  .field-row:last-child{border-bottom:none;}
  .field-label{width:110px;flex-shrink:0;color:var(--ink-soft);font-weight:500;}
  .field-value{white-space:pre-wrap;}
  .addr-block{white-space:pre-wrap;font-size:13.5px;line-height:1.5;}

  .section-head{display:flex;justify-content:space-between;align-items:center;margin:26px 0 12px 0;}
  .section-head h2{font-family:var(--font-body);font-size:17px;margin:0;}

  /* ---- Modal ---- */
  .overlay{position:fixed;inset:0;background:rgba(12,18,24,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal{background:var(--surface);border-radius:4px;width:520px;max-width:100%;max-height:88vh;overflow-y:auto;padding:26px 28px;}
  .modal h2{font-family:var(--font-body);font-size:19px;margin:0 0 4px 0;}
  .modal .modal-sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:18px;}
  .form-group{margin-bottom:14px;}
  .form-group label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
  .form-row{display:flex;gap:12px;}
  .form-row .form-group{flex:1;}
  input[type=text],input[type=email],input[type=tel],input[type=date],input[type=password],select,textarea{
    width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:2px;font-family:var(--font-body);font-size:13.5px;background:#fff;color:var(--ink);
  }
  textarea{resize:vertical;min-height:60px;}
  input:focus,select:focus,textarea:focus{outline:1px solid var(--ink);outline-offset:0;border-color:var(--ink);}
  .checkbox-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);margin:-4px 0 14px 0;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line);}
  .required{color:var(--danger);}
  .field-error{color:var(--danger);font-size:12px;margin-top:8px;}

  .history-item{display:flex;gap:10px;font-size:12.5px;padding:7px 0;border-bottom:1px solid #EDEDEA;}
  .history-item:last-child{border-bottom:none;}
  .history-date{color:var(--ink-soft);width:88px;flex-shrink:0;}

  .transfer-banner{background:var(--warn-bg);color:var(--accent-dark);padding:10px 12px;border-radius:2px;font-size:12.5px;margin-bottom:16px;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--steel);color:#fff;padding:11px 20px;border-radius:4px;font-size:13.5px;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.2);}
</style>
</head>
<body>
<div id="root"></div>

<script>
/* ============ DATA STORE (backed by the SQLite database via /api/*) ============ */
const API = '/api';
let state = {
  view: { page: 'customers' }, // {page:'customers'|'customer-detail'|'generators', id?}
  search: '',
  genSearch: '',
  genFilterBrand: '',   // '' = All brands
  genFilterStatus: '',  // '' = All statuses
  modal: null, // {type, ...}
  sidebarOpen: false,
  toast: null,
  loading: true,
  loadError: null,
  currentUser: null,
  authChecked: false,
  loginError: null,
  loginBusy: false,
  customers: [],
  generators: []
};

async function apiCall(path, options){
  const opts = Object.assign({}, options);
  if(!(opts.body instanceof FormData)) opts.headers = {'Content-Type':'application/json'};
  const res = await fetch(API + path, opts);
  let body = null;
  try { body = await res.json(); } catch(e){}
  if(!res.ok){
    if(res.status === 401 && path !== '/login' && path !== '/me' && state.currentUser) sessionExpired();
    const err = new Error((body && body.error) || ('Request failed (' + res.status + ')'));
    err.status = res.status;
    err.code = body && body.code;
    throw err;
  }
  return body;
}

// If someone else edited the record first, reload so the next attempt starts from their version.
async function handleSaveError(err){
  if(err.code === 'stale') await refreshData();
  if(err.status !== 401) showToast('Error: ' + err.message);
}

// Only one save/delete runs at a time, so double-clicks can't create duplicates.
let actionInFlight = false;
async function exclusive(el, fn){
  if(actionInFlight) return;
  actionInFlight = true;
  const buttons = !el ? [] : el.tagName === 'FORM' ? [...el.querySelectorAll('button[type=submit]')] : [el];
  buttons.forEach(b => { b.disabled = true; if(b.dataset.busyLabel){ b.dataset.idleLabel = b.textContent; b.textContent = b.dataset.busyLabel; } });
  try { await fn(); }
  finally {
    actionInFlight = false;
    buttons.forEach(b => { b.disabled = false; if(b.dataset.idleLabel) b.textContent = b.dataset.idleLabel; });
  }
}

async function refreshData(){
  try{
    const [customers, generators] = await Promise.all([apiCall('/customers'), apiCall('/generators')]);
    state.customers = customers;
    state.generators = generators;
    render();
  } catch(err){}
}

// Pick up other users' changes when coming back to the tab, unless a form is open.
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible' && state.currentUser && !state.loading && !state.modal) refreshData();
});

async function loadAll(){
  state.loading = true;
  state.loadError = null;
  render();
  try{
    const [customers, generators] = await Promise.all([
      apiCall('/customers'),
      apiCall('/generators')
    ]);
    state.customers = customers;
    state.generators = generators;
  } catch(err){
    state.loadError = err.message;
  }
  state.loading = false;
  render();
}

/* ============ AUTH ============ */
async function checkAuth(){
  try{
    state.currentUser = await apiCall('/me');
  } catch(err){
    state.currentUser = null;
  }
}

async function init(){
  await checkAuth();
  state.authChecked = true;
  if(state.currentUser){
    await loadAll();
  } else {
    render();
  }
}

async function handleLogin(e){
  e.preventDefault();
  const f = e.target;
  const username = f.username.value.trim();
  const password = f.password.value;
  if(!username || !password) return;
  state.loginError = null;
  state.loginBusy = true;
  render();
  try{
    state.currentUser = await apiCall('/login', {method:'POST', body: JSON.stringify({username, password})});
    state.loginBusy = false;
    await loadAll();
  } catch(err){
    state.loginBusy = false;
    state.loginError = err.message;
    render();
  }
}

function clearSession(){
  state.currentUser = null;
  state.customers = [];
  state.generators = [];
  state.view = {page:'customers'};
  state.modal = null;
  state.sidebarOpen = false;
}

async function logout(){
  try{ await apiCall('/logout', {method:'POST'}); } catch(err){}
  clearSession();
  state.loginError = null;
  render();
}

function sessionExpired(){
  clearSession();
  state.loginError = 'Your session has expired. Please sign in again.';
  render();
}

/* ============ HELPERS ============ */
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(d){ if(!d) return '—'; const dt = new Date(d+'T00:00:00'); if(isNaN(dt)) return esc(d); return dt.toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}); }
// Local calendar date (the app is only used in Maine); toISOString() would give the UTC date, a day ahead after ~8pm.
function isoDate(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function today(){ return isoDate(new Date()); }
function oneYearFromToday(){ const d = new Date(); d.setFullYear(d.getFullYear()+1); return isoDate(d); }
function digits(s){ return (s||'').replace(/\D/g, ''); }
// The server enforces permissions; this just hides controls the user can't use.
function can(permission){ return !!(state.currentUser && (state.currentUser.permissions || []).includes(permission)); }
const ROLE_LABELS = {admin:'Admin', technician:'Technician'};
function customerById(id){ return state.customers.find(c=>c.id===id); }
function generatorsByCustomer(id){ return state.generators.filter(g=>g.customerId===id); }
function allServiceRecords(){
  const rows = [];
  state.generators.forEach(g => g.history.forEach(h => {
    if(h.event === 'Serviced') rows.push({...h, generatorId: g.id, make: g.make, model: g.model, serial: g.serial, customerId: g.customerId});
  }));
  return rows;
}
function serviceStatus(gen){
  if(!gen.lastServiceDate) return {label:'No service on file', cls:'badge-none'};
  let due;
  if(gen.nextServiceDate){
    due = new Date(gen.nextServiceDate+'T00:00:00');
  } else {
    const last = new Date(gen.lastServiceDate+'T00:00:00');
    due = new Date(last); due.setFullYear(due.getFullYear()+1);
  }
  const now = new Date();
  const daysToDue = Math.round((due-now)/86400000);
  if(daysToDue < 0) return {label:'Service overdue', cls:'badge-due'};
  if(daysToDue <= 60) return {label:'Service due soon', cls:'badge-warn'};
  return {label:'Up to date', cls:'badge-ok'};
}
// Only touches the toast slot, so an error toast doesn't re-render (and wipe) an open form.
let toastTimer = null;
function showToast(msg){
  state.toast = msg; renderToastOnly();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ state.toast=null; renderToastOnly(); }, msg.length > 60 ? 5000 : 2600);
}
function renderToastOnly(){ const el = document.getElementById('toast-slot'); if(el) el.innerHTML = state.toast? toastHtml() : ''; }
function toastHtml(){ return `<div class="toast">${esc(state.toast)}</div>`; }

function goTo(page, id){ state.view = {page, id}; state.modal=null; state.sidebarOpen=false; render(); window.scrollTo(0,0); }
let pendingConfirm = null;
let pendingCancel = null;
function openModal(m){
  if(m.type==='confirm'){ pendingConfirm = m.onConfirm; pendingCancel = m.onCancel || null; }
  state.modal = m; render(); focusModal();
}
function runPendingConfirm(btn){ if(pendingConfirm) exclusive(btn, pendingConfirm); }
function closeModal(){
  if(state.modal && state.modal.type==='confirm' && pendingCancel){ const cancel = pendingCancel; pendingCancel = null; cancel(); return; }
  state.modal = null; render();
}
function focusModal(){
  const el = document.querySelector('.modal input:not([disabled]):not([type=hidden]), .modal select:not([disabled]), .modal textarea, .modal button');
  if(el) el.focus();
}
function toggleSidebar(){ state.sidebarOpen = !state.sidebarOpen; render(); }

/* ============ CUSTOMER CRUD ============ */
function saveCustomerForm(e, editId){
  e.preventDefault();
  const f = e.target;
  const name = f.name.value.trim();
  if(!name){ return; }
  const data = {
    name,
    email: f.email.value.trim(),
    phone: f.phone.value.trim(),
    physicalAddress: f.physicalAddress.value.trim(),
    billingAddress: f.billingSame.checked ? f.physicalAddress.value.trim() : f.billingAddress.value.trim(),
    notes: f.notes.value.trim()
  };
  return exclusive(f, async ()=>{
    try{
      if(editId){
        data.expectedUpdatedAt = customerById(editId).updatedAt;
        const updated = await apiCall('/customers/'+editId, {method:'PUT', body: JSON.stringify(data)});
        const idx = state.customers.findIndex(c=>c.id===editId);
        state.customers[idx] = updated;
        showToast('Customer updated.');
        goTo('customer-detail', editId);
      } else {
        const created = await apiCall('/customers', {method:'POST', body: JSON.stringify(data)});
        state.customers.push(created);
        showToast('Customer added.');
        goTo('customer-detail', created.id);
      }
    } catch(err){
      await handleSaveError(err);
    }
  });
}
function deleteCustomer(id){
  const gens = generatorsByCustomer(id);
  if(gens.length>0){
    openModal({type:'blocked', message:`This customer has ${gens.length} generator${gens.length>1?'s':''} on file. Transfer or remove them before deleting this customer.`});
    return;
  }
  openModal({type:'confirm', title:'Delete customer?', message:'This cannot be undone.', onConfirm: async ()=>{
    try{
      await apiCall('/customers/'+id, {method:'DELETE'});
      state.customers = state.customers.filter(c=>c.id!==id);
      closeModal();
      showToast('Customer deleted.');
      goTo('customers');
    } catch(err){
      closeModal();
      await handleSaveError(err);
    }
  }});
}

/* ============ GENERATOR CRUD ============ */
function saveGeneratorForm(e, editId, presetCustomerId){
  e.preventDefault();
  const f = e.target;
  const make = f.make.value.trim();
  const model = f.model.value.trim();
  const serial = f.serial.value.trim();
  const customerId = presetCustomerId || parseInt(f.customerId.value);
  if(!make || !model || !serial || !customerId) return;
  const data = {
    make, model, serial,
    customerId,
    physicalAddress: f.physicalAddress.value.trim(),
    installDate: f.installDate.value,
    lastServiceDate: f.lastServiceDate.value,
    nextServiceDate: f.nextServiceDate.value,
    installerName: f.installerName.value.trim(),
    notes: f.notes.value.trim()
  };
  return exclusive(f, async ()=>{
    try{
      if(editId){
        data.expectedUpdatedAt = state.generators.find(x=>x.id===editId).updatedAt;
        const updated = await apiCall('/generators/'+editId, {method:'PUT', body: JSON.stringify(data)});
        const idx = state.generators.findIndex(x=>x.id===editId);
        state.generators[idx] = updated;
        showToast('Generator updated.');
      } else {
        const created = await apiCall('/generators', {method:'POST', body: JSON.stringify(data)});
        state.generators.push(created);
        showToast('Generator added.');
      }
      closeModal();
    } catch(err){
      await handleSaveError(err);
    }
  });
}
function deleteGenerator(id){
  openModal({type:'confirm', title:'Remove generator?', message:'This will permanently remove the generator record, its service history, and its attachments.', onConfirm: async ()=>{
    try{
      await apiCall('/generators/'+id, {method:'DELETE'});
      state.generators = state.generators.filter(g=>g.id!==id);
      closeModal();
      showToast('Generator removed.');
    } catch(err){
      closeModal();
      await handleSaveError(err);
    }
  }});
}
function transferGeneratorSubmit(e, genId){
  e.preventDefault();
  const f = e.target;
  const newCustomerId = parseInt(f.newCustomerId.value);
  const note = f.note.value.trim();
  const gen = state.generators.find(g=>g.id===genId);
  if(!newCustomerId || newCustomerId===gen.customerId) return;
  return exclusive(f, async ()=>{
    try{
      const updated = await apiCall('/generators/'+genId+'/transfer', {method:'POST', body: JSON.stringify({newCustomerId, note})});
      const idx = state.generators.findIndex(g=>g.id===genId);
      state.generators[idx] = updated;
      closeModal();
      const toCust = customerById(newCustomerId);
      showToast(`Generator transferred to ${toCust ? toCust.name : 'new customer'}.`);
      goTo('customer-detail', newCustomerId);
    } catch(err){
      await handleSaveError(err);
    }
  });
}
function saveServiceRecordForm(e, presetGenId){
  e.preventDefault();
  const f = e.target;
  const genId = presetGenId || parseInt(f.generatorId.value);
  if(!genId) return;
  const data = {
    serviceDate: f.serviceDate.value,
    nextServiceDate: f.nextServiceDate.value,
    notes: f.notes.value.trim()
  };
  if(!data.serviceDate) return;
  return exclusive(f, async ()=>{
    try{
      const before = state.generators.find(g=>g.id===genId);
      const updated = await apiCall('/generators/'+genId+'/service-records', {method:'POST', body: JSON.stringify(data)});
      const idx = state.generators.findIndex(g=>g.id===genId);
      state.generators[idx] = updated;
      closeModal();
      const backdated = before && before.lastServiceDate && data.serviceDate < before.lastServiceDate;
      showToast(backdated ? 'Service record added to history. It’s older than the last service, so the schedule was left as is.' : 'Service record added.');
    } catch(err){
      await handleSaveError(err);
    }
  });
}

/* ============ SERVICE RECORDS (invoicing) ============ */
function submitInvoiceToggle(btn, historyId, nextInvoiced){
  return exclusive(btn, async ()=>{
    try{
      const updated = await apiCall('/service-records/'+historyId+'/invoice', {method:'POST', body: JSON.stringify({invoiced: nextInvoiced})});
      const idx = state.generators.findIndex(g=>g.id===updated.id);
      state.generators[idx] = updated;
      closeModal();
      showToast(nextInvoiced ? 'Marked as invoiced.' : 'Invoice mark undone.');
    } catch(err){
      await handleSaveError(err);
    }
  });
}

/* ============ ATTACHMENTS ============ */
function submitAttachmentUpload(e, genId){
  e.preventDefault();
  const f = e.target;
  const files = f.file.files;
  if(!files || files.length === 0){ showToast('Choose a file first.'); return; }
  const formData = new FormData();
  formData.append('file', files[0]);
  return exclusive(f, async ()=>{
    try{
      const updated = await apiCall('/generators/' + genId + '/attachments', {method:'POST', body: formData});
      const idx = state.generators.findIndex(g=>g.id===genId);
      state.generators[idx] = updated;
      closeModal();
      showToast('File uploaded.');
    } catch(err){
      await handleSaveError(err);
    }
  });
}
function deleteAttachment(attId, genId){
  const backToDetail = ()=>{ state.modal = {type:'generator-detail', genId}; render(); };
  openModal({type:'confirm', title:'Delete attachment?', message:'This cannot be undone.', onCancel: backToDetail, onConfirm: async ()=>{
    try{
      const updated = await apiCall('/attachments/'+attId, {method:'DELETE'});
      const idx = state.generators.findIndex(g=>g.id===updated.id);
      state.generators[idx] = updated;
      backToDetail();
      showToast('Attachment deleted.');
    } catch(err){
      backToDetail();
      await handleSaveError(err);
    }
  }});
}

/* ============ ACCOUNT ============ */
function saveAccountForm(e){
  e.preventDefault();
  const f = e.target;
  const data = {email: f.email.value.trim()};
  // Only send notification choices if this user can have them, so a technician's save never touches them.
  if(can('notifications.receive')) data.notifications = [...f.querySelectorAll('input[name=notify]:checked')].map(cb=>cb.value);
  return exclusive(f, async ()=>{
    try{
      state.currentUser = await apiCall('/account', {method:'PUT', body: JSON.stringify(data)});
      closeModal();
      showToast('Account settings saved.');
    } catch(err){
      await handleSaveError(err);
    }
  });
}
function sendTestEmail(btn){
  return exclusive(btn, async ()=>{
    try{
      const res = await apiCall('/account/test-email', {method:'POST'});
      showToast('Test email sent to ' + res.sentTo + '.');
    } catch(err){
      await handleSaveError(err);
    }
  });
}

/* ============ RENDER: SHELL ============ */
function render(){
  const root = document.getElementById('root');
  if(!state.authChecked){
    root.innerHTML = `<div class="empty-state" style="padding-top:120px;"><div class="big">Loading…</div></div>`;
    return;
  }
  if(!state.currentUser){
    root.innerHTML = loginScreenHtml();
    return;
  }
  root.innerHTML = `
    <div class="app-shell">
      ${renderSidebar()}
      ${state.sidebarOpen ? `<div class="sidebar-backdrop" onclick="toggleSidebar()"></div>` : ''}
      <div class="main">
        <div class="mobile-topbar">
          <button class="hamburger-btn" onclick="toggleSidebar()" aria-label="Toggle menu">☰</button>
          <span class="dog-mark sm"></span><span class="mobile-topbar-brand">Watt Watch</span>
        </div>
        ${renderPage()}
      </div>
    </div>
    ${state.modal ? renderModal() : ''}
    <div id="toast-slot">${state.toast? toastHtml() : ''}</div>
  `;
  document.body.style.overflow = state.sidebarOpen ? 'hidden' : '';
  linkFormLabels(root);
}

// Tie each .form-group label to its control so screen readers announce it and clicking the label focuses it.
let labelSeq = 0;
function linkFormLabels(scope){
  scope.querySelectorAll('.form-group').forEach(group=>{
    const label = group.querySelector(':scope > label');
    const control = group.querySelector('input, select, textarea');
    if(!label || !control || label.htmlFor) return;
    if(!control.id) control.id = 'fld-' + (++labelSeq);
    label.htmlFor = control.id;
  });
}

document.addEventListener('keydown', e=>{
  if(e.key === 'Escape'){
    if(state.modal){ closeModal(); }
    else if(state.sidebarOpen){ toggleSidebar(); }
    return;
  }
  // Clickable table rows are focusable; let Enter activate them like a link.
  if(e.key === 'Enter' && e.target.matches && e.target.matches('tr.row-link')){ e.target.click(); }
});

function loginScreenHtml(){
  return `
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);">
    <div class="modal" style="width:360px;">

function renderPage(){
  if(state.loadError){
    return `<div class="empty-state"><div class="big">Couldn't reach the database</div>${esc(state.loadError)}<div style="margin-top:16px;"><button class="btn btn-primary btn-sm" onclick="loadAll()">Retry</button></div></div>`;
  }
  if(state.loading){
    return `<div class="empty-state"><div class="big">Loading…</div>Fetching data from the database.</div>`;
  }
  if(state.view.page==='customers') return renderCustomersList();
  if(state.view.page==='customer-detail') return renderCustomerDetail(state.view.id);
  if(state.view.page==='generators') return renderGeneratorsList();
  if(state.view.page==='service-records') return renderServiceRecordsPage();
  return '';
}

/* ============ RENDER: CUSTOMERS LIST ============ */
function updateSearch(val){ state.search = val; renderListOnly(); }
function renderListOnly(){
  document.querySelector('.panel-slot')?.remove();
  const container = document.getElementById('customers-panel-holder');
  if(container) container.innerHTML = customersPanelHtml();
}
function customersPanelHtml(){
  const q = state.search.toLowerCase();
  const qDigits = digits(q);
  const rows = state.customers.filter(c =>
    !q || c.name.toLowerCase().includes(q) || (c.email||'').toLowerCase().includes(q) || (c.phone||'').includes(q) ||
    (qDigits.length >= 3 && digits(c.phone).includes(qDigits))
  );
  if(rows.length===0){
    return `<div class="panel"><div class="empty-state"><div class="big">No customers match your search</div>Try a different name, email, or phone number.</div></div>`;
  }
  return `<div class="panel"><table>
    <thead><tr><th>Customer</th><th>Contact</th><th>Physical address</th><th>Generators</th><th></th></tr></thead>
    <tbody>
      ${rows.map(c=>{
        const gens = generatorsByCustomer(c.id);

          <td><div class="name-cell">${esc(c.name)}</div></td>

          <td>${gens.length}</td>

          <td style="text-align:right;white-space:nowrap;">
            ${can('service.log') ? `<button class="btn btn-ghost btn-sm" onclick='event.stopPropagation(); openModal({type:"service-record", presetGenId:${g.id}})'>Log service</button>` : ''}

/* ============ RENDER: MODALS ============ */
function renderModal(){
  const m = state.modal;
  let inner = '';
  if(m.type==='customer') inner = customerFormHtml(m.editId);
  else if(m.type==='generator') inner = generatorFormHtml(m.editId, m.presetCustomerId);
  else if(m.type==='transfer') inner = transferFormHtml(m.genId);
  else if(m.type==='service-record') inner = serviceRecordFormHtml(m.presetGenId, m.presetCustomerId);
  else if(m.type==='service-record-detail') inner = serviceRecordDetailHtml(m.historyId);
  else if(m.type==='generator-detail') inner = generatorDetailHtml(m.genId);
  else if(m.type==='upload-attachment') inner = uploadAttachmentFormHtml(m.genId);
  else if(m.type==='confirm') inner = confirmHtml(m);
  else if(m.type==='blocked') inner = blockedHtml(m);
  else if(m.type==='account') inner = accountFormHtml();
  return `<div class="overlay" onclick="if(event.target===this) closeModal()">${inner}</div>`;
}

function prefillGeneratorAddress(select){
  const form = select.closest('form');
  const addrField = form.physicalAddress;
  if(addrField.value.trim()) return;
  const cust = customerById(parseInt(select.value));
  if(cust) addrField.value = cust.physicalAddress || '';
}
function toggleBillingField(cb){
  const group = document.getElementById('billingAddrGroup');
  group.style.display = cb.checked ? 'none' : '';
}
function syncBillingIfSame(textarea){
  const cb = document.getElementById('billingSame');
  if(cb && cb.checked){
    const form = textarea.closest('form');
    form.billingAddress.value = textarea.value;
  }
}

          <div>Updated by <b>${esc(g.updatedBy)||'—'}</b></div>
        </div>
        ${g.physicalAddress? `<div class="gen-notes" style="white-space:pre-wrap;">📍 ${esc(g.physicalAddress)}</div>` : ''}
        ${g.notes? `<div class="gen-notes">${esc(g.notes)}</div>` : ''}
      </div>
    </div>
    <div class="form-group" style="margin-top:16px;">
      <label>Attachments</label>
      <div class="panel" style="padding:10px 12px;">
        ${g.attachments && g.attachments.length ? g.attachments.map(a=>attachmentRowHtml(a, g.id)).join('') : `<div class="history-item">No files uploaded yet.</div>`}
      </div>
    </div>
    <div class="form-group" style="margin-top:16px;">
      <label>History</label>
      <div class="panel" style="padding:4px 12px;">
        ${history.length ? history.map(h=>`<div class="history-item"><div class="history-date">${fmtDate(h.date)}</div><div><b>${esc(h.event)}</b>${h.by?` — logged by ${esc(h.by)}`:''}<br>${esc(h.detail)}</div></div>`).join('') : `<div class="history-item">No history recorded yet.</div>`}
      </div>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn btn-secondary" onclick="closeModal()">Close</button>
    </div>
  </div>`;
}

function attachmentRowHtml(a, genId){
  let preview;
  if(a.kind === 'image' && a.contentType !== 'image/heic'){
    preview = `<a href="${a.url}" target="_blank"><img src="${a.url}" alt="${esc(a.filename)}" style="width:52px;height:52px;object-fit:cover;border-radius:2px;border:1px solid var(--line);flex-shrink:0;"></a>`;
  } else if(a.kind === 'video'){
    preview = `<video src="${a.url}" controls preload="metadata" style="width:120px;border-radius:2px;flex-shrink:0;"></video>`;
  } else {
    preview = `<a href="${a.url}" target="_blank" class="btn btn-ghost btn-sm" style="flex-shrink:0;">📄 View</a>`;
  }
  return `<div style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid #EDEDEA;">
    ${preview}
    <div style="flex:1;min-width:0;">
      <div style="font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(a.filename)}</div>
      <div class="sub-cell">Uploaded by ${esc(a.uploadedBy)||'—'} on ${fmtDate(a.uploadedAt)}</div>
    </div>
    ${can('attachments.delete') ? `<button class="btn btn-danger btn-sm" onclick="deleteAttachment(${a.id}, ${genId})">Delete</button>` : ''}
  </div>`;
}

function generatorFormHtml(editId, presetCustomerId){
  const g = editId? state.generators.find(x=>x.id===editId) : null;
  const lockedCustomerId = presetCustomerId || (g? g.customerId : null);
  const lockedCust = lockedCustomerId ? customerById(lockedCustomerId) : null;
  return `
  <div class="modal">
    <h2>${g? 'Edit generator' : 'New generator'}</h2>
    <div class="modal-sub">Every generator must be linked to a customer card.</div>
    <form onsubmit="saveGeneratorForm(event, ${g?g.id:'null'}, ${lockedCust? lockedCust.id : 'null'})">
      <div class="form-group">
        <label>Customer <span class="required">*</span></label>
        ${lockedCust
          ? `<input type="text" value="${esc(lockedCust.name)}" disabled style="background:var(--bg);">`
          : `<select name="customerId" required onchange="prefillGeneratorAddress(this)">
              <option value="">Select a customer…</option>
              ${state.customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}
            </select>`
        }
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Make <span class="required">*</span></label>
          <input type="text" name="make" required value="${g?esc(g.make):''}" placeholder="e.g. Generac">
        </div>
        <div class="form-group">
          <label>Model <span class="required">*</span></label>
          <input type="text" name="model" required value="${g?esc(g.model):''}" placeholder="e.g. Guardian 22kW">
        </div>
      </div>
      <div class="form-group">
        <label>Serial number <span class="required">*</span></label>
        <input type="text" name="serial" required value="${g?esc(g.serial):''}">
      </div>
      <div class="form-group">
        <label>Site address</label>
        <textarea name="physicalAddress" placeholder="Street, City, State, ZIP">${g ? esc(g.physicalAddress) : (lockedCust ? esc(lockedCust.physicalAddress) : '')}</textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Install date</label>
          <input type="date" name="installDate" value="${g?esc(g.installDate):''}">
        </div>
        <div class="form-group">
          <label>Last service date</label>
          <input type="date" name="lastServiceDate" value="${g?esc(g.lastServiceDate):''}">
        </div>
        <div class="form-group">
          <label>Next service date</label>
          <input type="date" name="nextServiceDate" value="${g?esc(g.nextServiceDate):''}">
        </div>
      </div>
      <div class="form-group">
        <label>Installer name</label>
        <input type="text" name="installerName" value="${g?esc(g.installerName):''}">
      </div>
      <div class="form-group">
        <label>General notes</label>
        <textarea name="notes" placeholder="Fuel type, tank location, access notes…">${g?esc(g.notes):''}</textarea>
      </div>
      ${g && g.history && g.history.length ? `
        <div class="form-group">
          <label>History</label>
          <div class="panel" style="padding:4px 12px;">
            ${g.history.slice().sort((a,b)=> b.date.localeCompare(a.date)).map(h=>`<div class="history-item"><div class="history-date">${fmtDate(h.date)}</div><div><b>${esc(h.event)}</b>${h.by?` — logged by ${esc(h.by)}`:''}<br>${esc(h.detail)}</div></div>`).join('')}
          </div>
        </div>` : ''}
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-primary">${g?'Save changes':'Add generator'}</button>
      </div>
    </form>
  </div>`;
}

function uploadAttachmentFormHtml(genId){
  const g = state.generators.find(x=>x.id===genId);
  return `
  <div class="modal">
    <h2>Upload file</h2>
    <div class="modal-sub">${g? esc(g.make)+' '+esc(g.model)+' — S/N '+esc(g.serial) : ''}</div>
    <form onsubmit="submitAttachmentUpload(event, ${genId})">
      <div class="form-group">
        <label>File <span class="required">*</span></label>
        <input type="file" name="file" required accept=".jpg,.jpeg,.png,.gif,.webp,.heic,.pdf,.mp4,.mov,.webm">
      </div>
      <p style="font-size:12px;color:var(--ink-soft);margin-top:-6px;">Images (JPG, PNG, GIF, WEBP, HEIC), video (MP4, MOV, WEBM), or PDF. Max 100MB.</p>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-primary" data-busy-label="Uploading…">Upload</button>
      </div>
    </form>
  </div>`;
}

function transferFormHtml(genId){
  const g = state.generators.find(x=>x.id===genId);
  const current = customerById(g.customerId);
  const options = state.customers.filter(c=>c.id!==g.customerId);
  return `
  <div class="modal">
    <h2>Transfer generator</h2>
    <div class="modal-sub">${esc(g.make)} ${esc(g.model)} — S/N ${esc(g.serial)}</div>
    <div class="transfer-banner">Currently linked to <b>${esc(current?current.name:'Unknown')}</b>. Transferring moves this unit — and its full service history — to a new customer card. Use this when a home changes hands.</div>
    ${options.length===0 ? `<p style="font-size:13.5px;color:var(--ink-soft);">There's no other customer to transfer to yet. Add a new customer first.</p>
      <div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Close</button></div>` :
    `<form onsubmit="transferGeneratorSubmit(event, ${g.id})">
      <div class="form-group">
        <label>Transfer to <span class="required">*</span></label>
        <select name="newCustomerId" required>
          <option value="">Select new customer…</option>
          ${options.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}
        </select>
      </div>
      <div class="form-group">
        <label>Note (optional)</label>
        <textarea name="note" placeholder="e.g. Property sold, closing date 8/1/2026"></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-primary">Confirm transfer</button>
      </div>
    </form>`}
  </div>`;
}

function serviceRecordFormHtml(presetGenId, presetCustomerId){
  const presetGen = presetGenId ? state.generators.find(g=>g.id===presetGenId) : null;
  const lockedCustomerId = presetGen ? presetGen.customerId : presetCustomerId;
  const lockedCust = lockedCustomerId ? customerById(lockedCustomerId) : null;

  const customerFieldHtml = lockedCust
    ? `<input type="text" value="${esc(lockedCust.name)}" disabled style="background:var(--bg);">`
    : `<select name="customerId" required onchange="updateServiceGenOptions(this)">
        <option value="">Select a customer…</option>
        ${state.customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}
      </select>`;

  let generatorFieldHtml;
  if(presetGen){
    generatorFieldHtml = `<input type="text" value="${esc(presetGen.make)} ${esc(presetGen.model)} — S/N ${esc(presetGen.serial)}" disabled style="background:var(--bg);">`;
  } else {
    const gens = lockedCustomerId ? generatorsByCustomer(lockedCustomerId) : [];
    generatorFieldHtml = `<select name="generatorId" id="serviceGenSelect" required ${gens.length===0?'disabled':''}>
        <option value="">${!lockedCustomerId ? 'Select a customer first…' : (gens.length===0 ? 'No generators for this customer' : 'Select a generator…')}</option>
        ${gens.map(g=>`<option value="${g.id}">${esc(g.make)} ${esc(g.model)} — S/N ${esc(g.serial)}</option>`).join('')}
      </select>`;
  }

  return `
  <div class="modal">
    <h2>Log service record</h2>
    <div class="modal-sub">Records a service visit on a generator's history and schedules the next one.</div>
    <form onsubmit="saveServiceRecordForm(event, ${presetGen ? presetGen.id : 'null'})">
      <div class="form-group">
        <label>Customer <span class="required">*</span></label>
        ${customerFieldHtml}
      </div>
      <div class="form-group">
        <label>Generator <span class="required">*</span></label>
        ${generatorFieldHtml}
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Service date <span class="required">*</span></label>
          <input type="date" name="serviceDate" required value="${today()}">
        </div>
        <div class="form-group">
          <label>Next service date</label>
          <input type="date" name="nextServiceDate" value="${oneYearFromToday()}">
        </div>
      </div>
      <div class="form-group">
        <label>Notes</label>
        <textarea name="notes" placeholder="What was done, parts used, observations…"></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-primary">Save service record</button>
      </div>
    </form>
  </div>`;
}
function updateServiceGenOptions(customerSelect){
  const custId = parseInt(customerSelect.value);
  const genSelect = document.getElementById('serviceGenSelect');
  if(!genSelect) return;
  const gens = custId ? generatorsByCustomer(custId) : [];
  if(!custId){
    genSelect.innerHTML = `<option value="">Select a customer first…</option>`;
    genSelect.disabled = true;
  } else if(gens.length===0){
    genSelect.innerHTML = `<option value="">No generators for this customer</option>`;
    genSelect.disabled = true;
  } else {
    genSelect.disabled = false;
    genSelect.innerHTML = `<option value="">Select a generator…</option>` +
      gens.map(g=>`<option value="${g.id}">${esc(g.make)} ${esc(g.model)} — S/N ${esc(g.serial)}</option>`).join('');
  }
}

function serviceRecordDetailHtml(historyId){
  const r = allServiceRecords().find(x=>x.id===historyId);
  if(!r) return `<div class="modal" style="width:420px;"><h2>Service record not found</h2><div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Close</button></div></div>`;
  const cust = customerById(r.customerId);
  return `
  <div class="modal" style="width:460px;">
    <h2>Service record</h2>
    <div class="modal-sub">${esc(r.make)} ${esc(r.model)} — S/N ${esc(r.serial)}${cust ? ` · ${esc(cust.name)}` : ''}</div>
    <div class="field-row"><div class="field-label">Date</div><div class="field-value">${fmtDate(r.date)}</div></div>
    <div class="field-row"><div class="field-label">Detail</div><div class="field-value">${esc(r.detail)}</div></div>
    <div class="field-row"><div class="field-label">Logged by</div><div class="field-value">${esc(r.by)||'—'}</div></div>
    ${r.invoiced ? `<div class="field-row"><div class="field-label">Invoiced</div><div class="field-value">By ${esc(r.invoicedBy)||'—'} on ${fmtDate(r.invoicedAt)}</div></div>` : ''}
    <div class="modal-actions">
      <button type="button" class="btn btn-secondary" onclick="closeModal()">Close</button>
      ${!can('service.invoice') ? '' : r.invoiced
        ? `<button type="button" class="btn btn-ghost" onclick="submitInvoiceToggle(this, ${r.id}, false)">Undo invoiced</button>`
        : `<button type="button" class="btn btn-primary" onclick="submitInvoiceToggle(this, ${r.id}, true)">Mark as invoiced</button>`
      }
    </div>
  </div>`;
}

function confirmHtml(m){
  return `
  <div class="modal" style="width:420px;">
    <h2>${esc(m.title)}</h2>
    <p style="font-size:13.5px;color:var(--ink-soft);">${esc(m.message)}</p>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-danger" onclick="runPendingConfirm(this)">Confirm</button>
    </div>
  </div>`;
}
function accountFormHtml(){
  const u = state.currentUser;
  const canReceive = can('notifications.receive');
  const enabled = new Set(u.notifications || []);
  const kinds = (u.notificationKinds || []).map(k=>`
        <div class="checkbox-row" style="margin:0 0 8px 0;">
          <input type="checkbox" id="notify-${esc(k.kind)}" name="notify" value="${esc(k.kind)}" ${enabled.has(k.kind)?'checked':''} ${canReceive?'':'disabled'}>
          <label for="notify-${esc(k.kind)}" style="margin:0;font-weight:400;">${esc(k.label)}</label>
        </div>`).join('');
  return `
  <div class="modal">
    <h2>Account settings</h2>
    <div class="modal-sub">Signed in as ${esc(u.username)} (${esc(ROLE_LABELS[u.role] || u.role)}).</div>
    <form onsubmit="saveAccountForm(event)">
      <div class="form-group">
        <label>Email address</label>
        <input type="email" name="email" value="${esc(u.email)}" placeholder="you@example.com" autocomplete="email">
        ${canReceive ? '' : `<div class="sub-cell" style="margin-top:6px;">Saved for future account features such as password reset.</div>`}
      </div>
      <div class="form-group">
        <span style="display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;">Email notifications</span>
        <div class="panel" style="padding:12px 14px;${canReceive?'':'opacity:.6;'}">
          ${kinds}
          ${canReceive ? '' : `<div class="sub-cell">Email notifications are available to admins.</div>`}
        </div>
        ${canReceive && u.emailConfigured === false ? `<div class="field-error">Email isn't set up on the server yet, so nothing will be sent. Ask whoever manages the Railway settings to add SMTP2GO.</div>` : ''}
      </div>
      <div class="modal-actions">
        ${canReceive ? `<button type="button" class="btn btn-ghost" style="margin-right:auto;" onclick="sendTestEmail(this)" ${u.email?'':'disabled title="Save an email address first"'}>Send test email</button>` : ''}
        <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>`;
}

function blockedHtml(m){
  return `
  <div class="modal" style="width:420px;">
    <h2>Can't delete yet</h2>
    <p style="font-size:13.5px;color:var(--ink-soft);">${esc(m.message)}</p>
    <div class="modal-actions">
      <button class="btn btn-primary" onclick="closeModal()">Got it</button>
    </div>
  </div>`;
}

init();
</script>
</body>
</html>
